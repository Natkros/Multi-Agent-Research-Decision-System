name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint-and-test:
    name: Backend lint, type-check, unit tests (offline/sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend + dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check app tests
      - name: mypy (type check)
        run: mypy app
      - name: pytest (offline, in-memory sqlite — no external services required)
        run: pytest -q

  backend-postgres-integration:
    name: Backend integration tests against real Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://research:research@localhost:5432/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend + dev dependencies
        run: pip install -e ".[dev]"
      # First real-Postgres run of this migration chain in the project's
      # history (see CHANGELOG Phase 10) — every earlier phase verified
      # `alembic upgrade head` only against a scratch sqlite file.
      - name: alembic upgrade head (real Postgres)
        run: alembic upgrade head
      - name: pytest against real Postgres (DATABASE_URL set)
        run: pytest -q

  frontend:
    name: Frontend lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: next build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  security-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -e .
          # --strict fails on ANY package it can't resolve on an index, which
          # includes one merely skipped via --skip-editable — so --strict and
          # --skip-editable actively conflict. Audit a frozen requirements
          # list with the local (unpublished) package filtered out instead,
          # keeping --strict meaningful for the actual third-party deps.
          pip freeze | grep -v '^-e ' | grep -v '^multi-agent-research-backend' > /tmp/frozen-requirements.txt
          pip-audit --strict -r /tmp/frozen-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend dependencies, high+ only)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  docker-build:
    name: Build backend + frontend Docker images
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: multi-agent-research-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          tags: multi-agent-research-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: docker compose config (validates the full stack wiring)
        run: |
          cp .env.example .env
          docker compose config >/dev/null

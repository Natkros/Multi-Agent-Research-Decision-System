[project]
name = "multi-agent-research-backend"
version = "0.1.0"
description = "Multi-Agent Research & Decision System — backend (Phase 1: single-agent MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "openai>=1.54",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
    "langgraph>=0.6",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    "redis>=5.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "tenacity>=9.0",
    "PyJWT>=2.9",
    "bcrypt>=4.1",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Phase 10 CI gate: a focused rule set (correctness/imports/upgrades), not a
# full strict-style suite — this codebase predates ruff and a blanket
# ruleset would be hundreds of pure style fixes unrelated to correctness.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Phase 10 CI gate: type-check on a best-effort basis over a codebase that
# was written without mypy in the loop for 9 phases — untyped defs/decorators
# are common (FastAPI routes, LangGraph nodes) and not worth a mass rewrite
# to satisfy strict mode just for this phase.
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests/", "alembic/"]
